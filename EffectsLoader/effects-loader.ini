; =====================================================================
; effects-loader.ini - Configuration file
; Place this file NEXT TO EffectLoader.asi (any folder works - the plugin
; finds its own location). Missing file or missing keys = defaults below.
; Delete effects-loader-cache\ to force a full re-encode after changing
; Fidelity / MaxDim (format-affecting options do NOT auto-invalidate).
; Diagnose via log.txt (DDS-CACHE lines + final DDS-CACHE SUMMARY block).
; =====================================================================

[Memory]

; FxMemoryPool_c blueprint definition memory pool capacity (in megabytes).
; Default game engine capacity is 1 MB.
; Recommended: 16 (or 32 for massive effect overhaul packs).
FxPoolSizeMB = 16

[Cache]

; Master switch. 0 = pure stock behavior (all PNG, no cache files touched).
Enabled = 1

; Fidelity tier:
;   lossless - every texture cached as uncompressed 32-bit BGRA, no mipmaps.
;              Pixel-identical to the PNG path. Biggest files, safest.
;   balanced - RECOMMENDED. Opaque -> DXT1, transparent -> DXT5 (+HIGHQUAL),
;              tiny (<=32px) stays BGRA, mipmaps on large power-of-two only.
;   fast     - balanced + downscale anything larger than MaxDim (256 default).
;              Smallest files, slight softening on huge sprites.
Fidelity = balanced

; Mipmaps for non-power-of-two textures (e.g. 200x200, 175x175).
;   0 - OFF (default). D3D9-era hardware may reject mipmapped NPOT textures;
;       a rejection is harmless (PNG fallback + HIT-FAILED log line) but noisy.
;   1 - TRY IT. If your log stays free of HIT-FAILED lines, your GPU accepts
;       them and distant smoke/shockwaves shimmer less. Report back either way.
MipsNPOT = 0

; Max texture dimension, 0 = OFF (keep author resolution).
; Larger sprites are box-downscaled BEFORE analysis/compression, e.g. a
; 512px Spark becomes 256px. Only shrinking, never enlarging.
; fast tier uses 256 when this is 0.
MaxDim = 0

; Cache directory override, empty = default (<game>\modloader\.effects-cache if modloader exists, else <game>\effects-loader-cache).
;   absolute : "D:\GTA Cache\fx" or "\\NAS\share\fx" (used as-is)
;   relative : "my_fx_cache" -> <game>\my_fx_cache
CacheDir =

; =====================================================================
; Per-texture overrides: add these tokens ANYWHERE in the file name or
; its folder path (case-insensitive). Author suffix wins over auto logic.
;   _nocache - skip caching entirely (always PNG path)
;   _dxt1    - force DXT1 (maker refuses on transparent pixels -> DXT5 + log)
;   _dxt5    - force DXT5 (opaque pixels are downgraded to DXT1 + log)
;   _bgra    - force uncompressed 32-bit (lossless)
;   _nomip   - no mipmaps for this texture
;   _mip     - force mipmaps even on NPOT (same HW caveat as MipsNPOT)
; NOTE: renaming the FILE changes its texture name (fxs lookup breaks!),
; to veto a single texture put the token in a PARENT FOLDER name instead.
; =====================================================================

; =====================================================================
; Hard rules (always apply, not configurable):
; - DXT needs width AND height divisible by 4 (D3D9 block alignment).
;   Others fall back to lossless BGRA, logged as "+align4->bgra".
; - Paletted PNGs (depth 8) are expanded through their palette first.
; - Cache lives in <game>\modloader\.effects-cache\ (outside all scan trees).
; - Freshness = cache newer than source PNG; format bumps auto-wipe
;   (see "DDS-CACHE VERSION wipe" in the log). Removed mods' files are
;   swept at the end of loading ("DDS-CACHE SWEEP" lines).
; =====================================================================
